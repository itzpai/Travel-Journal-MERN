version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: travel_journal_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_LOCAL_URI=mongodb://mongodb:27017/travel_journal
      # Make sure to replace this with your actual secret in production or use an .env file
      - ACCESS_TOKEN_SECRET=your-access-secret-key-for-docker
      - REFRESH_TOKEN_SECRET=your-refresh-secret-key-for-docker
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: travel_journal_client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
